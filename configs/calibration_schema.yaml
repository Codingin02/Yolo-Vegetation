calibration_schema:
  supported_modes:
    - manual_reference
    - pixel_ratio
    - no_calibration
  required_manual_fields:
    - reference_object_height_m
    - reference_object_pixel_height
  output_fields:
    - estimated_tree_height_m
    - estimated_asset_height_m
    - clearance_m
    - uncertainty_m
    - calibration_status
    - calibration_method
  warning: "Do not claim accurate height or clearance until local calibration is verified."
