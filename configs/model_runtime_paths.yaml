candidate_model_paths:
  - weights/best.pt
  - models/best.pt
  - models/field/best.pt
  - runs/field_multiclass/yolov8n_v1/weights/best.pt
  - runs/detect/train/weights/best.pt
env_override: ULP_YOLO_MODEL_PATH
cli_override: --model-path
accepted_suffixes:
  - .pt
  - .onnx
minimum_size_bytes: 1024
class_order:
  0: struktur_penyangga
  1: konduktor
  2: pohon_sono
policy:
  no_auto_download: true
  training_requires_explicit_operator_command: true
  no_dummy_model: true
  no_accuracy_claim: true
