status: DATA_SOURCE_PENDING_DEEP_RESEARCH
phase4_contract: RULE_BASED_STUB_ONLY
inputs:
  soil_ph:
    required: false
    note: Menunggu data tanah resmi/literatur tersitasi.
  rainfall_mm:
    required: false
    note: Menunggu sumber resmi seperti BMKG.
  humidity_percent:
    required: false
    note: Menunggu sumber cuaca resmi.
  temperature_c:
    required: false
    note: Menunggu sumber cuaca resmi.
  season_label:
    required: false
    note: Menunggu definisi musim berbasis sumber.
  tree_species:
    required: false
    note: Nama spesies dari data lapangan.
  growth_stage:
    required: false
    note: Tahap pertumbuhan harus dari observasi atau sumber valid.
  maintenance_history:
    required: false
    note: Riwayat pemangkasan/pemeliharaan jika tersedia.
  species:
    required: true
    note: Nama spesies hasil pengamatan, bukan asumsi model.
  distance_to_conductor_m:
    required: false
    note: Jarak aktual atau estimasi terkalibrasi ke konduktor.
  canopy_density:
    required: false
    note: Kepadatan tajuk dari data lapangan atau hasil analisis citra.
  rainfall_factor:
    required: false
    note: Menunggu sumber resmi seperti BMKG.
  soil_factor:
    required: false
    note: Menunggu data tanah resmi atau literatur yang tersitasi.
  season_factor:
    required: false
    note: Menunggu data musim/cuaca yang valid.
outputs:
  - risk_score
  - risk_level
  - explanation
  - missing_inputs
  - status
