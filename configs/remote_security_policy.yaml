security_enabled: true
max_clients: 1
max_frame_size_bytes: 1500000
max_fps_per_client: 1
session_token_required: true
unknown_session_policy: reject
log_policy:
  log_base64_image: false
  log_tokens: false
  log_credentials: false
public_tunnel_warning: "Prototype riset; jangan buka tunnel publik tanpa token session dan operator yang mengawasi."
