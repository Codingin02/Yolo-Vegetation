  - 11
  - 12
  - 13
default_reference_pole_height_m: 12.0
default_reference_status: NEEDS_PLN_CONFIRMATION
clearance_threshold_m: 3.0
measurement_mode: MONOCULAR_REFERENCE_SCALING_CANDIDATE
notes:
