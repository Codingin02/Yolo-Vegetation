<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/mobile.css">
  <title>ULP Field Runtime</title>
</head>
<body>
  <main class="shell">
    <header>
      <h1>ULP Field Runtime</h1>
      <p id="network-state">MODEL_NOT_READY mode is accepted for upload queue.</p>
    </header>
    <section class="panel">
      <label>Point ID
        <input id="point_id" name="point_id" value="V001_pohon_sono" autocomplete="off">
      </label>
      <label>Foto inspeksi
        <input id="image" name="image" type="file" accept="image/*" capture="environment">
      </label>
      <label>Catatan operator
        <textarea id="operator_note" name="operator_note" rows="3"></textarea>
      </label>
      <div class="coords">
        <input id="lat" name="lat" placeholder="lat" inputmode="decimal">
        <input id="lon" name="lon" placeholder="lon" inputmode="decimal">
      </div>
      <div class="actions">
        <button id="gps-btn" type="button">Ambil GPS</button>
        <button id="upload-btn" type="button">Upload</button>
      </div>
    </section>
    <section class="panel">
      <h2>Status Job</h2>
      <pre id="status-output">READY_FOR_MOBILE_UPLOAD</pre>
    </section>
  </main>
  <script src="/static/mobile_app.js"></script>
</body>
</html>
