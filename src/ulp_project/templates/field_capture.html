<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/field_capture.css">
  <title>ULP Field Capture</title>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Field Capture Browser</h1>
      <p>HP hanya input lapangan; laptop memproses dan laporan utama masuk CSV/Sheets + peta.</p>
    </header>
    <section class="panel">
      <label>Point ID
        <input id="point_id" value="V001_pohon_sono" autocomplete="off">
      </label>
      <label>Jenis objek manual
        <input id="species" value="pohon_sono" autocomplete="off">
      </label>
      <label>Asset type
        <select id="asset_type">
          <option value="span">span</option>
          <option value="kabel">kabel</option>
          <option value="trafo">trafo</option>
        </select>
      </label>
      <label>Clearance manual (m)
        <input id="clearance_m" placeholder="contoh 0.3" inputmode="decimal">
      </label>
      <label>Growth rate manual (m/day)
        <input id="growth_rate_m_per_day" placeholder="contoh 0.01" inputmode="decimal">
      </label>
      <label>Tinggi pohon manual (m)
        <input id="tree_height_m" placeholder="opsional" inputmode="decimal">
      </label>
      <label>Tinggi kabel/span manual (m)
        <input id="cable_or_span_height_m" placeholder="opsional" inputmode="decimal">
      </label>
      <label>Tinggi asset manual (m)
        <input id="asset_height_m" placeholder="opsional" inputmode="decimal">
      </label>
      <label>Titik terendah span (m)
        <input id="span_lowest_point_height_m" placeholder="opsional" inputmode="decimal">
      </label>
      <label>Musim / cuaca ringkas
        <input id="season" placeholder="opsional">
      </label>
      <label>Curah hujan (mm)
        <input id="rainfall_mm" placeholder="opsional" inputmode="decimal">
      </label>
      <label>Suhu (C)
        <input id="temperature_c" placeholder="opsional" inputmode="decimal">
      </label>
      <label>Kelembapan relatif (%)
        <input id="relative_humidity_percent" placeholder="opsional" inputmode="decimal">
      </label>
      <video id="camera" playsinline autoplay muted></video>
      <canvas id="frame" hidden></canvas>
      <div class="actions">
        <button id="open-camera" type="button">Buka Kamera</button>
        <button id="capture-frame" type="button">Capture Frame</button>
      </div>
      <label>Upload file foto
        <input id="image" type="file" accept="image/*" capture="environment">
      </label>
      <label>Catatan operator
        <textarea id="operator_note" rows="3"></textarea>
      </label>
      <div class="coords">
        <input id="lat" placeholder="lat" inputmode="decimal">
        <input id="lon" placeholder="lon" inputmode="decimal">
      </div>
      <div class="actions">
        <button id="gps-btn" type="button">Ambil GPS</button>
        <button id="ping-btn" type="button">Test koneksi laptop</button>
        <button id="upload-btn" type="button">Submit Inspection</button>
      </div>
      <div class="actions">
        <a class="button-link" href="/api/network/whoami" target="_blank">Network debug</a>
        <a class="button-link" href="/api/operator/latest-report" target="_blank">Export CSV status</a>
        <a class="button-link" href="/api/operator/map-status" target="_blank">Map status</a>
      </div>
    </section>
    <section class="panel">
      <h2>Hasil Ringkas</h2>
      <pre id="status-output">FIELD_CAPTURE_READY_MODEL_NOT_READY</pre>
    </section>
  </main>
  <script src="/static/field_capture.js"></script>
</body>
</html>
