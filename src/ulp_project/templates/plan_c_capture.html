<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Capture Plan C</title>
  <link rel="stylesheet" href="/static/plan_c_fullscreen_camera_v4.css?v=20260611_4">
  <link rel="stylesheet" href="/static/plan_c_bottom_nav_v4.css?v=20260611_4">
</head>
<body>
  <main id="pcv4-app" class="pcv4-app">
    <section class="pcv4-camera-stage">
      <video id="pcv4-video" class="pcv4-video" autoplay muted playsinline webkit-playsinline></video>
      <canvas id="pcv4-canvas" class="pcv4-canvas"></canvas>
      <input id="pcv4-gallery-input" class="pcv4-gallery-input" type="file" accept="image/*">

      <div id="pcv4-anchor-modal" class="pcv4-anchor-modal" role="dialog" aria-modal="true" aria-labelledby="pcv4-anchor-title">
        <div class="pcv4-anchor-card">
          <h1 id="pcv4-anchor-title">Konfirmasi posisi</h1>
          <p>Apakah Anda sudah berada tepat di bawah pohon yang akan diprediksi?</p>
          <div class="pcv4-anchor-actions">
            <button id="pcv4-anchor-no" class="pcv4-anchor-secondary" type="button">Tidak</button>
            <button id="pcv4-anchor-yes" class="pcv4-anchor-primary" type="button">Ya</button>
          </div>
        </div>
      </div>

      <div id="pcv4-processing" class="pcv4-processing hidden" aria-live="polite">
        <div class="pcv4-spinner"></div>
        <strong>Processing</strong>
        <span>Mengirim snapshot ke server</span>
      </div>

      <div class="pcv4-hint">
        Foto pohon, konduktor, dan struktur penyangga dalam satu frame.
      </div>

      <div class="pcv4-camera-controls" aria-label="Kontrol kamera">
        <button id="pcv4-gallery" class="pcv4-tool-button" type="button" aria-label="Pilih foto dari galeri">□</button>
        <button id="pcv4-shutter" class="pcv4-shutter" type="button" aria-label="Ambil snapshot"></button>
        <button id="pcv4-lens" class="pcv4-tool-button" type="button" aria-label="Ganti lensa">↻</button>
      </div>
    </section>

    <nav id="pcv4-bottom-nav" class="pcv4-bottom-nav">
      <a class="pcv4-nav-item" href="/plan-c">Home</a>
      <button id="pcv4-camera-nav" class="pcv4-nav-item active" type="button">Kamera</button>
      <span id="pcv4-map-nav" class="pcv4-nav-item disabled">Map</span>
      <span id="pcv4-result-nav" class="pcv4-nav-item disabled">Result</span>
    </nav>
  </main>

  <script src="/static/plan_c_fullscreen_camera_v4.js?v=20260611_4"></script>
  <script src="/static/plan_c_bottom_nav_v4.js?v=20260611_4"></script>
</body>
</html>
