<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/field_capture.css">
  <link rel="stylesheet" href="/static/field_capture_glass.css">
  <title>Manual Field Input</title>
</head>
<body>
  <main class="shell">
    <header class="glass-hero">
      <p class="eyebrow">Monitoring Vegetasi 20 kV</p>
      <h1>Manual Input</h1>
      <p>Fallback untuk pohon tidak bisa difoto, kabel tertutup, backlight, jarak sempit, akses terbatas, atau model belum membaca objek.</p>
    </header>
    <section class="glass-card">
      <form id="manual-input-form">
        <label>point_id <input name="point_id" value="V001_pohon_sono"></label>
        <label>object_type <input name="object_type" value="pohon_sono"></label>
        <label>estimated_distance_m <input name="estimated_distance_m" inputmode="decimal"></label>
        <label>estimated_tree_height_m <input name="estimated_tree_height_m" inputmode="decimal"></label>
        <label>estimated_conductor_height_m <input name="estimated_conductor_height_m" inputmode="decimal"></label>
        <label>obstruction_reason
          <select name="obstruction_reason">
            <option value="POHON_TIDAK_BISA_DIFOTO">pohon tidak bisa difoto</option>
            <option value="KABEL_TERTUTUP_BANGUNAN">kabel tertutup bangunan</option>
            <option value="JARAK_TERLALU_SEMPIT">jarak sempit</option>
            <option value="BACKLIGHT_PARAH">backlight parah</option>
            <option value="AKSES_LAPANGAN_DIBATASI">akses lapangan dibatasi</option>
            <option value="MODEL_BELUM_MEMBACA_OBJEK">model belum membaca objek</option>
          </select>
        </label>
        <label>operator_notes <textarea name="operator_notes" rows="4"></textarea></label>
        <button class="primary-action" type="submit">Save Manual Input</button>
      </form>
      <pre id="manual-input-output">MANUAL_OPERATOR_INPUT_NOT_AI_DETECTION</pre>
      <nav class="bottom-nav">
        <a href="/field-capture">Capture</a>
        <button id="session-report" type="button">Report</button>
        <button id="session-result" type="button">Result</button>
      </nav>
    </section>
  </main>
  <script src="/static/field_navigation.js"></script>
  <script>
    document.getElementById('manual-input-form').addEventListener('submit', async function (event) {
      event.preventDefault();
      const payload = Object.fromEntries(new FormData(event.target).entries());
      payload.session_id = window.FieldNavigation ? window.FieldNavigation.currentSessionId() : '';
      const response = await fetch('/api/field/manual-input', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      document.getElementById('manual-input-output').textContent = JSON.stringify(await response.json(), null, 2);
    });
  </script>
</body>
</html>
