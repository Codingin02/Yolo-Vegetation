<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detail Teknis - Sistem Monitoring Vegetasi</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar"><a href="/vegetation/result/{{ session_id }}">Kembali</a><strong>Detail Teknis</strong><span></span></header>
  <main class="page developer-page">
    {% for name, payload in files.items() %}
      <details>
        <summary>{{ name }}</summary>
        <pre>{{ payload|tojson(indent=2) }}</pre>
      </details>
    {% endfor %}
  </main>
</body>
</html>
